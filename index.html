<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Builder No-Code - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        .template-card:hover .overlay {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">

<div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-md flex-shrink-0 flex flex-col">
        <div class="p-6 border-b border-gray-200">
            <h1 class="text-2xl font-bold text-indigo-600"><i class="fas fa-layer-group mr-2"></i>SiteBuilder</h1>
        </div>
        <nav class="flex-1 overflow-y-auto p-4 space-y-2">
            <a href="#" class="flex items-center p-3 text-gray-700 bg-gray-100 rounded-lg font-medium" id="nav-projects">
                <i class="fas fa-folder-open w-6"></i> I Miei Progetti
            </a>
            <a href="#" class="flex items-center p-3 text-gray-600 hover:bg-gray-50 rounded-lg transition-colors" id="nav-templates">
                <i class="fas fa-paint-brush w-6"></i> Template Gallery
            </a>
        </nav>
        <div class="p-4 border-t border-gray-200 text-sm text-gray-500 text-center">
            v1.0 No-Code
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-8" id="main-content">

        <!-- My Projects View -->
        <div id="view-projects" class="space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-3xl font-bold text-gray-800">I Miei Progetti</h2>
                <button onclick="document.getElementById('nav-templates').click()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition shadow-sm">
                    <i class="fas fa-plus mr-2"></i>Nuovo Progetto
                </button>
            </div>

            <div id="projects-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Projects will be injected here via JS -->
                <div id="no-projects-message" class="col-span-full text-center py-12 text-gray-500 hidden">
                    <i class="fas fa-folder-open text-4xl mb-3 text-gray-300"></i>
                    <p class="text-lg">Nessun progetto salvato. Crea il tuo primo sito!</p>
                </div>
            </div>
        </div>

        <!-- Templates View (Initially hidden) -->
        <div id="view-templates" class="space-y-6 hidden">
            <div class="flex justify-between items-center">
                <h2 class="text-3xl font-bold text-gray-800">Template Gallery</h2>
                <div class="flex space-x-2">
                    <button class="filter-btn active bg-indigo-100 text-indigo-700 px-4 py-2 rounded-full text-sm font-medium" data-filter="all">Tutti</button>
                    <button class="filter-btn bg-white text-gray-600 hover:bg-gray-50 px-4 py-2 rounded-full text-sm font-medium border border-gray-200" data-filter="wow">Wow Effect</button>
                    <button class="filter-btn bg-white text-gray-600 hover:bg-gray-50 px-4 py-2 rounded-full text-sm font-medium border border-gray-200" data-filter="professional">Professional</button>
                    <button class="filter-btn bg-white text-gray-600 hover:bg-gray-50 px-4 py-2 rounded-full text-sm font-medium border border-gray-200" data-filter="generalist">Generalisti</button>
                </div>
            </div>

            <div id="templates-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Templates will be injected here via JS -->
            </div>
        </div>

    </main>
</div>

<script src="js/dashboard.js"></script>
</body>
</html>
